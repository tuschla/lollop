org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Apple targets compile and link only on a macOS host; elsewhere they are
# skipped with a warning instead of failing the build.
kotlin.native.ignoreDisabledTargets=true
# nativeMain (shared by linuxX64 and the iOS targets) calls the core through
# cinterop, so the `lollop` bindings are commonized for it.
kotlin.mpp.enableCInteropCommonization=true
