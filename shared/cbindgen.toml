# Generates include/lollo.h from src/ffi/c_abi.rs:
#   cbindgen --config shared/cbindgen.toml --crate shared --output shared/include/lollo.h
# CI runs the same command with `--verify`, so a stale header fails the build.
language = "C"
include_guard = "LOLLO_H"
autogen_warning = "/* Generated by cbindgen from shared/src/ffi/c_abi.rs. Do not edit. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "c99"
usize_is_size_t = true

[defines]
"feature = test-hooks" = "LOLLO_TEST_HOOKS"

[export]
include = ["LolloBytes", "LolloSlice"]
# Only the `lollo_*` functions and their two structs: the crate's other public
# constants and types are core internals, not part of the C ABI.
item_types = ["functions", "structs"]
