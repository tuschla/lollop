[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `cdylib` is the Android `libshared.so`; `lib` serves tests and the workspace.
# The iOS core is a `staticlib` built with `cargo rustc --crate-type staticlib
# --features c-abi` (scripts/build-ios-core.sh), which replaces this list for
# that one build: Cargo has no per-target crate types, and an Apple `cdylib`
# needs Apple's linker, which a Linux host lacks.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
crux_core = { workspace = true }
fitparser = "0.11.0"
serde = { workspace = true, features = ["derive"] }
# Already linked through crux_core (its `JsonFfiFormat` is serde_json), so the
# FFI error envelope and FIT payload use it directly at no size cost.
# `float_roundtrip`: a correctly rounded float parser (feature unification
# turns it on for crux_core's event decode too), so the shortest decimal a
# coordinate is written as (GPX export, the shell's event JSON) reads back to
# the same f64; the default fast parser is off by one ulp on ~2-6% of them.
serde_json = { version = "1", features = ["float_roundtrip"] }
# `jni` is a plain optional dependency (off by default) enabled by `jni-host`
# below, so the JNI exports can link into a HOST-JVM build for offline UI/UX QA
# (Robolectric drives the real Rust core). The android-target entry below keeps
# it non-optional for device builds. Both tables name the same crate/version; on
# an android build the target entry wins and the feature is irrelevant.
jni = { version = "0.22", default-features = false, optional = true }

[features]
# `#[effect(typegen)]` in app/mod.rs emits shell-codegen type registration gated on
# this feature. The Android JSON FFI shell never needs it, so keep it
# off by default; enable with `--features typegen` when generating shell types.
typegen = ["crux_core/typegen"]
# The platform-neutral bridge API (`shared::ffi`) on a non-Android host. Android
# builds get it through the target cfg; `jni-host` and `c-abi` enable it.
ffi = []
# Compile the `Java_app_milestone_Core_*` JNI exports (shared/src/ffi.rs) on a
# NON-Android host so `cargo build -p shared --features jni-host` yields a
# target/debug/libshared.so the JVM QA tests load via System.loadLibrary. Off by
# default: production android builds get the exports through the target cfg, not
# this feature.
jni-host = ["dep:jni", "ffi"]
# The `lollop_*` C ABI (shared/src/ffi/c_abi.rs, header include/lollop.h) the
# iOS app links from Kotlin/Native. Off for Android.
c-abi = ["ffi"]
# `lollop_panic_for_test` for the Kotlin/Native bridge tests (kmp/core-bridge).
# Never in an app build.
test-hooks = ["c-abi"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }
