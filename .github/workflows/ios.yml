name: iOS core

# The core's C ABI for the iOS app (shared/src/ffi/c_abi.rs), its Kotlin/Native
# bridge (android/core-bridge) and the app's iOS framework (android/lollop-ios
# over android/lollop). Path-filtered: only changes that can affect them run it.
# The repo is public, so the macOS job costs no minutes.
on:
  push:
    paths: &paths
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".java-version"
      - "android/core-bridge/**"
      - "android/lollop/**"
      - "android/lollop-ios/**"
      - "android/build-logic/**"
      - "android/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "scripts/build-ios-core.sh"
      - "scripts/lib/rust-core.env"
      - ".github/actions/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge-linux:
    name: iOS staticlibs + Kotlin/Native bridge tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          konan: "true"

      - name: C header is current
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --quiet --config shared/cbindgen.toml --crate shared --output shared/include/lollop.h --verify

      - name: Build iOS staticlibs (no Apple SDK needed)
        run: |
          scripts/build-ios-core.sh
          ls -l target/aarch64-apple-ios/release/libshared.a target/aarch64-apple-ios-sim/release/libshared.a

      - name: Bridge tests (linuxX64 against the host-built core)
        working-directory: android
        run: ./gradlew --no-daemon :core-bridge:linuxX64Test

  bridge-macos:
    name: iOS framework link + simulator tests (macOS)
    # Links the app's `Lollop` framework (:lollop-ios: the app's Kotlin + the
    # release Rust core) for a device, then runs every iOS test suite in a
    # simulator: the bridge (:core-bridge) and the app's tests (:lollop, among
    # them the event-log engine on a scripted core and on the real core).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          konan: "true"

      - uses: ./.github/actions/pick-simulator

      - name: Link the app framework (device) + run the iOS tests (simulator)
        working-directory: android
        run: >
          ./gradlew --no-daemon --continue
          :lollop-ios:linkReleaseFrameworkIosArm64
          :core-bridge:iosSimulatorArm64Test
          :lollop:iosSimulatorArm64Test
          -Plollop.iosSimulator="$SIMULATOR_UDID"

      - name: iOS test counts
        if: always()
        run: |
          for f in android/*/build/test-results/iosSimulatorArm64Test/*.xml; do
            [ -e "$f" ] && grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done
          true
