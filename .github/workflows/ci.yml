name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The emulator smoke and the full-length test modes are expensive, so they run
  # only on demand and weekly, never on every push/PR.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (fmt / clippy / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          java: "false"
          android: "false"
          rust: "true"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android unit + UI/UX QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          robolectric: "true"

      - name: Unit tests + offline UI/UX QA
        # :lollop:testAndroidHostTest runs the JVM wire-shape tests AND the
        # Robolectric UI/UX QA suite (plus the CMP strings parity gate) over the
        # real Rust core. Screenshot baselines are local-only (not in git) and no
        # roborazzi task runs here, so the screenshot tests run their UI and
        # assertions and skip the captures.
        working-directory: android
        run: ./gradlew --no-daemon :lollop:testAndroidHostTest

  release-r8:
    name: Release APK + R8 keep check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cargo-ndk: "true"

      - name: Release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Release R8 keep check
        run: scripts/check-release-r8.sh

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Lint (library + app shell)
        working-directory: android
        run: ./gradlew --no-daemon :lollop:lint :app:lintDebug

  deep:
    name: Full-length test modes (weekly)
    # The modes too long for every push: the 1–3-year simulated lives and every
    # copy-sweep pairing (Rust, release), the full accessibility crawl and the
    # longer history at the tracker's fix cadence (Kotlin). Every push runs the
    # same tests at their short sizes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          robolectric: "true"

      - name: Full simulated lives + copy sweep (Rust, release)
        env:
          LONG_HORIZON_FULL: "1"
          COPY_SWEEP_FULL: "1"
        run: cargo test --release --locked -p shared -- long_horizon copy_invariants

      - name: Full accessibility crawl + long history UI (Kotlin)
        working-directory: android
        env:
          A11Y_FULL: "1"
          LOLLOP_LONG_UI: "1"
        run: ./gradlew --no-daemon :lollop:testAndroidHostTest --tests '*AccessibilityAuditTest' --tests '*LongHistoryUiTest'

  emulator-smoke:
    name: Android on-device smoke (emulator)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cargo-ndk: "true"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device smoke (seed, set flow, monkey)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          # The runner executes each script line in its own shell, so every line
          # is self-contained (no `cd`, no multi-line constructs).
          working-directory: android
          script: |
            ./gradlew --no-daemon :app:assembleDebug
            QA_SKIP_BUILD=1 ../scripts/qa-emulator.sh --port 5554
