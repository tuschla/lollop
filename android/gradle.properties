# Linking Compose into the iOS framework needs a 4 GB heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Apple targets compile on any host (klibs) but link only on macOS; elsewhere
# the link tasks are skipped instead of failing the build.
kotlin.native.ignoreDisabledTargets=true
# :core-bridge's nativeMain (linuxX64 + iOS) and :lollo-ios's iosMain/iosTest
# call the core through cinterop, so the `lollo` bindings are commonized for them.
kotlin.mpp.enableCInteropCommonization=true
