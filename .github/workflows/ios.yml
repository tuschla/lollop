name: iOS core

# The core's C ABI for the iOS app (shared/src/ffi/c_abi.rs), its Kotlin/Native
# bridge (kmp/core-bridge) and the app's iOS framework (android/lollop-ios over
# android/lollop). Path-filtered: only changes that can affect them run it. The
# repo is public, so the macOS job costs no minutes.
on:
  push:
    paths:
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "kmp/**"
      - "ios/**"
      - "android/lollop/**"
      - "android/lollop-ios/**"
      - "android/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "scripts/build-ios-core.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "kmp/**"
      - "ios/**"
      - "android/lollop/**"
      - "android/lollop-ios/**"
      - "android/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "scripts/build-ios-core.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge-linux:
    name: iOS staticlibs + Kotlin/Native bridge tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.90"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: C header is current
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --quiet --config shared/cbindgen.toml --crate shared --output shared/include/lollop.h --verify

      - name: Build iOS staticlibs (no Apple SDK needed)
        run: |
          scripts/build-ios-core.sh aarch64-apple-ios aarch64-apple-ios-sim
          ls -l target/aarch64-apple-ios/release/libshared.a target/aarch64-apple-ios-sim/release/libshared.a

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kmp/core-bridge/build.gradle.kts') }}

      - name: Bridge tests (linuxX64 against the host-built core)
        working-directory: kmp
        run: ./gradlew --no-daemon :core-bridge:linuxX64Test

  bridge-macos:
    name: iOS framework link + simulator tests (macOS)
    # Builds from android/, which includes kmp/core-bridge. Links the app's
    # `Lollop` framework (:lollop-ios: the app's Kotlin + the release Rust core)
    # for a device, then runs every iOS test suite in a simulator: the bridge
    # (:core-bridge), the app's common tests (:lollop, among them the event-log
    # engine on a scripted core) and the engine on the real core (:lollop-ios).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.90"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        # Configuring the android/ build needs an SDK even for the iOS tasks.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kmp/core-bridge/build.gradle.kts', 'android/build.gradle.kts') }}

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Link the app framework (device) + run the iOS tests (simulator)
        working-directory: android
        # Linking Compose into a framework needs more heap than gradle.properties gives.
        run: >
          ./gradlew --no-daemon --continue "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
          :lollop-ios:linkReleaseFrameworkIosArm64
          :core-bridge:iosSimulatorArm64Test
          :lollop:iosSimulatorArm64Test
          :lollop-ios:iosSimulatorArm64Test
          -Plollop.iosSimulator="$SIMULATOR_UDID"

      - name: iOS test counts
        if: always()
        run: |
          for f in android/lollop/build/test-results/iosSimulatorArm64Test/*.xml \
                   android/lollop-ios/build/test-results/iosSimulatorArm64Test/*.xml \
                   kmp/core-bridge/build/test-results/iosSimulatorArm64Test/*.xml; do
            [ -e "$f" ] && grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done
          true
