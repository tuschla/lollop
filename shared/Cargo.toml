[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[dependencies]
crux_core = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[features]
# `#[effect(typegen)]` in app.rs emits shell-codegen type registration gated on
# this feature. The Android JSON FFI shell never needs it, so keep it
# off by default; enable with `--features typegen` when generating shell types.
typegen = ["crux_core/typegen"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }
serde_json = "1"
