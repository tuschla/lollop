name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The emulator smoke job is expensive (boots a real AVD), so it runs only on
  # demand and weekly, never on every push/PR.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (fmt / clippy / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          java: "false"
          android: "false"
          rust: "true"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android unit + UI/UX QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Cache Robolectric Android runtimes
        # Robolectric downloads its android-all jars from Maven at test time; a
        # Maven hiccup then fails every Robolectric class before any test runs.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/lollop/src/androidHostTest/resources/robolectric.properties') }}

      - name: Unit tests + offline UI/UX QA
        # :lollop:testAndroidHostTest runs the JVM wire-shape tests AND the
        # Robolectric UI/UX QA suite (plus the CMP strings parity gate) over the
        # real Rust core. Screenshot baselines are local-only (not in git) and no
        # roborazzi task runs here, so the screenshot tests run their UI and
        # assertions and skip the captures.
        working-directory: android
        run: ./gradlew --no-daemon :lollop:testAndroidHostTest

  lollop-ios:
    name: Shared module iOS compile (Linux)
    # Kotlin compiles the iOS klibs of :lollop's commonMain + iosMain on Linux;
    # only the framework link needs macOS. Catches common code that doesn't build
    # for iOS. No Rust: the module's iOS side doesn't link the core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          konan: "true"

      - name: Compile :lollop for iosArm64 + iosSimulatorArm64
        working-directory: android
        run: ./gradlew --no-daemon :lollop:compileKotlinIosArm64 :lollop:compileKotlinIosSimulatorArm64

  release-r8:
    name: Release APK + R8 keep check
    # Builds the release APK (the core for its ABIs through cargo-ndk) and checks
    # its R8 output: classes created by name at run time (JNI Core, manifest
    # components, startup initializers, Room/WorkManager reflection) must survive
    # minification; a miss only crashes the release APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          cargo-ndk: "true"

      - name: Release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Release R8 keep check
        run: scripts/check-release-r8.sh

  android-lint:
    name: Android lint
    # Lint reads sources and resources only; no Rust steps. Errors fail the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup

      - name: Lint (library + app shell)
        working-directory: android
        run: ./gradlew --no-daemon :lollop:lint :app:lintDebug

  emulator-smoke:
    name: Android on-device smoke (emulator)
    # Expensive: only weekly + on manual dispatch, never on push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          cargo-ndk: "true"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device smoke (assemble, install, monkey)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          # The runner executes each script line in its own shell, so every line
          # is self-contained (no `cd`, no multi-line constructs).
          working-directory: android
          script: |
            ./gradlew --no-daemon installDebug
            ../scripts/monkey-gate.sh
