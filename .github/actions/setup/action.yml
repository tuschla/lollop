name: Set up the build
description: >
  The toolchains a job needs, at the versions the repo pins: the JDK from
  .java-version, the Android SDK, Rust from rust-toolchain.toml (its targets and
  components included), cargo-ndk, and the Kotlin/Native and Robolectric caches.
inputs:
  java:
    description: JDK + Gradle cache
    default: "true"
  android:
    description: Android SDK (configuring android/ needs it, even for iOS tasks)
    default: "true"
  rust:
    description: Rust toolchain + cargo cache
    default: "false"
  cargo-ndk:
    description: cargo-ndk, for Gradle's Android builds of the core (implies rust)
    default: "false"
  konan:
    description: Kotlin/Native toolchain cache (~/.konan)
    default: "false"
  robolectric:
    description: >
      Robolectric's android-all jars (~/.m2/repository/org/robolectric), which it
      downloads from Maven at test time; a Maven hiccup would otherwise fail every
      Robolectric class before any test runs
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.java == 'true'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version-file: .java-version
        cache: gradle

    - if: inputs.android == 'true'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - if: inputs.rust == 'true' || inputs.cargo-ndk == 'true'
      name: Install the Rust toolchain of rust-toolchain.toml
      shell: bash
      run: rustup toolchain install

    - if: inputs.rust == 'true' || inputs.cargo-ndk == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - if: inputs.cargo-ndk == 'true'
      name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --locked --version 4.1.2

    - if: inputs.konan == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

    - if: inputs.robolectric == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/lollop/src/androidHostTest/resources/robolectric.properties') }}
