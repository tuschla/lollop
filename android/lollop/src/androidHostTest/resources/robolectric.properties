# Shared Robolectric config for the offline UI/UX QA suite.
#
# ONE uniform config for every Robolectric test so they all share a single
# sandbox classloader: the real Rust core (libshared.so) is loaded by Core's
# static init exactly once per test JVM, and re-loading it in a second
# classloader would throw "already loaded in another classloader". The runtime
# shadow emulates SDK 34 (compileSdk is 37); raising it means changing
# CoreHostSmokeTest's @Config(sdk = [34]) in the same edit. NATIVE graphics is
# forced via the gradle test JVM's robolectric.graphicsMode system property so
# Roborazzi captures real pixels.
# The qualifiers pin a common phone size (411x891 dp, xxhdpi) so layout,
# above-the-fold assertions and screenshots match what the owner sees.
sdk=34
qualifiers=w411dp-h891dp-xxhdpi
