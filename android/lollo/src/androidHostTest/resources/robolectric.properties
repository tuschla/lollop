# Shared Robolectric config for the offline UI/UX QA suite.
#
# The default config for every Robolectric test; a test pins another sdk only
# for an API-level behaviour it checks. The real Rust core (libshared.so) loads
# once per test JVM, through the JVM's own class loader in every sandbox
# (SharedCoreConfigurer). The runtime shadow emulates SDK 34 (compileSdk is 37).
# NATIVE graphics is forced via the gradle test JVM's robolectric.graphicsMode
# system property so Roborazzi captures real pixels.
# The qualifiers pin a common phone size (411x891 dp, xxhdpi) so layout,
# above-the-fold assertions and screenshots match what the owner sees.
sdk=34
qualifiers=w411dp-h891dp-xxhdpi
