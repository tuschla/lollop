# XcodeGen spec of the iOS app. The .xcodeproj is generated, not committed:
#   brew install xcodegen && xcodegen generate --spec iosApp/project.yml
# The app is a SwiftUI host (iosApp/LollopIosApp.swift) around the Kotlin
# framework `Lollop` (android/lollop-ios: the app's Compose UI, the core engine
# and the Rust core). A build phase runs Gradle, which builds the framework for
# the configuration and SDK being built and embeds it in the app.
name: lollop
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# MARKETING_VERSION and CURRENT_PROJECT_VERSION, shared with the Android app.
configFiles:
  Debug: ../app-version.xcconfig
  Release: ../app-version.xcconfig
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    # The app's identifiers, defined once: the targets' bundle ids below, the App
    # Group in both entitlements files and Info.plists ($(LOLLOP_APP_GROUP)), and
    # through the built Info.plists the CI (.github/workflows/ios-app.yml). An
    # installed app, its container and placed widgets are found by these values.
    LOLLOP_BUNDLE_ID: app.milestone.lollop
    LOLLOP_APP_GROUP: group.app.milestone.lollop
targets:
  lollop:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme lollop` works on a fresh checkout.
    scheme: {}
    sources:
      - path: iosApp
      # The App Group lookup, the activity content and the App Intents, shared
      # with the extension.
      - path: Shared
    dependencies:
      # Embedded in PlugIns/: the widgets, the Live Activities and the control.
      - target: LollopWidgets
    settings:
      base:
        PRODUCT_NAME: lollop
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOLLOP_BUNDLE_ID)"
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Where embedAndSignAppleFrameworkForXcode (the build phase below) writes
        # Lollop.framework: the path Kotlin's direct-integration docs give.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../android/lollop-ios/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Lollop"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Gradle reads and writes outside the build sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The App Group the widget extension reads the widget payload from.
        CODE_SIGN_ENTITLEMENTS: Entitlements/lollop.entitlements
    preBuildScripts:
      - name: Kotlin framework (Gradle)
        # Gradle tracks its own inputs; let it run on every build.
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -e
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          # The framework links the Rust core, which Gradle builds with cargo.
          # Xcode puts its toolchain's clang first on PATH and exports SDKROOT
          # (the iOS SDK); cargo's host build scripts would link with that clang
          # against no or the wrong SDK. /usr/bin's cc is the xcrun shim, which
          # picks the macOS SDK; the iOS objects get their SDK from cc-rs, and
          # Kotlin/Native finds its own through xcrun.
          export PATH="$HOME/.cargo/bin:/usr/bin:$PATH"
          unset SDKROOT
          cd "$SRCROOT/../android"
          ./gradlew :lollop-ios:embedAndSignAppleFrameworkForXcode
  # The app's one extension (each extension costs a free Apple Account an app ID):
  # the home and lock screen widget, the run's and the rest's Live Activities and
  # the Control Center control. Swift only; it reads what the app writes and
  # never links the Kotlin framework.
  LollopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LollopWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LollopWidgets
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOLLOP_BUNDLE_ID).widgets"
        INFOPLIST_FILE: LollopWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/LollopWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Shared/ compiles its calls into the Kotlin app only outside the extension.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOLLOP_WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # The extension's model and views in a simulator, on fixtures.json (the Kotlin
  # payload of every widget state) and the payload the app wrote
  # (LOLLOP_WIDGET_PAYLOAD), with renders of every family, state and activity
  # (LOLLOP_RENDER_DIR). No host app.
  LollopWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LollopWidgets
        excludes:
          - LollopWidgetsBundle.swift
          - Info.plist
      - path: Shared
      - path: LollopWidgetsTests
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOLLOP_BUNDLE_ID).widgets-tests"
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated one: the App Group SharedContainer reads.
        INFOPLIST_FILE: LollopWidgetsTests/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOLLOP_WIDGET_EXTENSION"
schemes:
  LollopWidgetsTests:
    build:
      targets:
        LollopWidgetsTests: [test]
    test:
      targets:
        - LollopWidgetsTests
