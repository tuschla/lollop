name: iOS app

# The iOS app (iosApp/, a SwiftUI host around android/lollop-ios's `Lollop`
# framework, and its widget extension LollopWidgets): an .ipa to sideload
# (ios/README.md), the extension's tests in a simulator, and a launch smoke test
# in a simulator. Runs on pushes to main that can change the app, and by hand.
# The repo is public, so the macOS jobs cost no minutes.
on:
  push:
    branches: [main]
    paths:
      - "iosApp/**"
      - "app-version.xcconfig"
      - "android/core-bridge/**"
      - "android/lollop/**"
      - "android/lollop-ios/**"
      - "android/build-logic/**"
      - "android/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".java-version"
      - "scripts/build-ios-core.sh"
      - "scripts/lib/rust-core.env"
      - ".github/actions/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ipa:
    name: Unsigned .ipa (device, Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          konan: "true"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Build for devices without signing
        # SideStore signs the app with the owner's Apple ID when it installs it.
        run: >
          xcodebuild build
          -project iosApp/lollop.xcodeproj -scheme lollop -configuration Release
          -sdk iphoneos -destination generic/platform=iOS
          -derivedDataPath build/ios-device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Check the extension and package lollop-unsigned.ipa
        run: |
          app=build/ios-device/Build/Products/Release-iphoneos/lollop.app
          appex="$app/PlugIns/LollopWidgets.appex"
          test -x "$app/lollop"
          test -d "$app/Frameworks/Lollop.framework"
          test -x "$appex/LollopWidgets"
          plutil -lint "$app/Info.plist" "$appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")" = com.apple.widgetkit-extension
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")" = app.milestone.lollop.widgets
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$app/Info.plist")" = true
          # Ad-hoc signatures that carry the App Group entitlement, inside out:
          # SideStore reads an app's groups from the signed binaries and registers
          # them for the Apple Account; an unsigned binary has none, and the widget
          # could not read the app's payload.
          for f in "$app"/Frameworks/*.framework; do codesign --force --sign - --timestamp=none "$f"; done
          codesign --force --sign - --timestamp=none --entitlements iosApp/Entitlements/LollopWidgets.entitlements "$appex"
          codesign --force --sign - --timestamp=none --entitlements iosApp/Entitlements/lollop.entitlements "$app"
          for b in "$appex" "$app"; do
            codesign -d --entitlements - "$b" 2>/dev/null | grep -q group.app.milestone.lollop || { echo "::error::$b has no App Group entitlement"; exit 1; }
          done
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../lollop-unsigned.ipa Payload)
          ls -l build/lollop-unsigned.ipa
          du -sh "$app" "$app/Frameworks/Lollop.framework" "$appex"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lollop-unsigned-ipa
          path: build/lollop-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  widgets:
    name: Widget extension tests (simulator)
    # The extension's model and views without the Kotlin framework: the day rule,
    # the line fitting, the App Group lookup, the activity content, and renders of
    # every widget family, state and activity (artifact `widget-renders`).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/pick-simulator

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Test the extension
        run: |
          mkdir -p build/widget-renders
          TEST_RUNNER_LOLLOP_RENDER_DIR="$PWD/build/widget-renders" xcodebuild test \
            -project iosApp/lollop.xcodeproj -scheme LollopWidgetsTests \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath build/ios-widgets
          ls build/widget-renders | wc -l

      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: widget-renders
          path: build/widget-renders/
          retention-days: 30
          if-no-files-found: ignore

  simulator:
    name: Launch smoke test (simulator, Debug)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          konan: "true"

      - uses: ./.github/actions/pick-simulator
        with:
          boot: "true"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: Build for the simulator
        run: >
          xcodebuild build
          -project iosApp/lollop.xcodeproj -scheme lollop -configuration Debug
          -destination "id=$SIMULATOR_UDID"
          -derivedDataPath build/ios-sim

      - name: The app embeds the widget extension
        run: |
          app=build/ios-sim/Build/Products/Debug-iphonesimulator/lollop.app
          appex="$app/PlugIns/LollopWidgets.appex"
          test -x "$appex/LollopWidgets"
          plutil -lint "$appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")" = com.apple.widgetkit-extension
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$app/Info.plist")" = true

      - name: Launch and keep running
        # The app must boot (restore the event log, SetToday) and draw Today
        # without dying; an uncaught Kotlin exception prints to stderr and
        # aborts the process, which leaves a crash report.
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/ios-sim/Build/Products/Debug-iphonesimulator/lollop.app
          out="$PWD/build/smoke"
          mkdir -p "$out"
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --level info --style compact \
            --predicate 'process == "lollop"' > "$out/app.log" 2>&1 &
          trap "kill $! 2>/dev/null || true" EXIT
          touch "$out/.launched"
          launched=$(xcrun simctl launch --stdout="$out/stdout.txt" --stderr="$out/stderr.txt" \
            "$SIMULATOR_UDID" app.milestone.lollop)
          echo "$launched"
          pid=${launched##*: }
          sleep 30
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$out/launch.png"
          alive=yes
          kill -0 "$pid" 2>/dev/null || alive=no
          # ReportCrash may still be writing; give it a moment when the app died.
          [ "$alive" = yes ] || sleep 10
          crashes=$(find ~/Library/Logs/DiagnosticReports -name 'lollop*' -newer "$out/.launched" 2>/dev/null || true)
          if [ -n "$crashes" ] || [ "$alive" = no ]; then
            echo "::error::lollop (pid $pid) crashed or exited within 30 s of launch"
            echo "--- stderr"; cat "$out/stderr.txt" || true
            for c in $crashes; do cp "$c" "$out/"; echo "--- $c"; head -c 30000 "$c"; echo; done
            exit 1
          fi
          echo "lollop is running (pid $pid)"

      - name: The app wrote the widget payload, and the extension reads it
        # Boot publishes a model; the app writes the widget payload into the App
        # Group container. The extension's code (LollopWidgetsTests) reads that file:
        # it decodes, describes today, and every family draws it.
        run: |
          out="$PWD/build/smoke"
          group=$(xcrun simctl get_app_container "$SIMULATOR_UDID" app.milestone.lollop group.app.milestone.lollop)
          test -s "$group/widget-today.json" || { echo "::error::no widget payload in $group"; ls -la "$group"; exit 1; }
          cp "$group/widget-today.json" "$out/"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(d["snapshot"]["kind"], "|", d["face"]["title"], "|", d["control"]["label"])' "$out/widget-today.json"
          mkdir -p "$out/widget-renders"
          TEST_RUNNER_LOLLOP_WIDGET_PAYLOAD="$out/widget-today.json" TEST_RUNNER_LOLLOP_RENDER_DIR="$out/widget-renders" \
            xcodebuild test -project iosApp/lollop.xcodeproj -scheme LollopWidgetsTests \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath build/ios-widgets \
            -only-testing:LollopWidgetsTests/LollopWidgetsTests/testThePayloadTheAppWroteReads
          ls "$out/widget-renders"

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-smoke
          path: build/smoke/
          retention-days: 30
          if-no-files-found: ignore
